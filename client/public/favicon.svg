<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a56db"/>
      <stop offset="100%" stop-color="#0b1e4f"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="15" fill="url(#blueGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Amber Top Brand Accent Strip -->
  <path d="M22 8 h20 a2 2 0 0 1 2 2 v1 a2 2 0 0 1 -2 2 h-20 a2 2 0 0 1 -2 -2 v-1 a2 2 0 0 1 2 -2 z" fill="url(#amberGrad)" filter="url(#shadow)"/>

  <!-- High-contrast Bold 5S Symbol -->
  <text x="32" y="44"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
        font-size="27"
        font-weight="900"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="-1">5S</text>

  <!-- Sub-label dot -->
  <circle cx="49" cy="22" r="3.5" fill="url(#amberGrad)"/>
</svg>
